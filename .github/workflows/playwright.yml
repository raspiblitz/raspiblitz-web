name: Playwright Tests

on:
  push:
    branches: [ master ]
  # Run on PRs targeting ANY base branch (not just master).
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend-mock/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install mock dependencies
        run: npm ci --prefix backend-mock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests against mock API
        run: npm run test:e2e
      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
