name: Playwright Tests

on:
  push:
    branches: [ master ]
  # Run on PRs targeting ANY base branch (not just master).
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each browser needs a fresh mock process: installation failure is consumed once.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend-mock/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install mock dependencies
        run: npm ci --prefix backend-mock
      - name: Install browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser tests against mock API
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
