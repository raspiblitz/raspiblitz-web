name: Node.js CI

on:
  push:
    branches: [ master ]
  # Run on PRs targeting ANY base branch (not just master), so CI runs on
  # stacked/feature-branch PRs too.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend-mock/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install mock dependencies
        run: npm ci --prefix backend-mock
      - name: Run Linting and formatting
        run: npm run lint
      - name: Run Typecheck
        run: npm run tsc
      - name: Run Tests
        run: npm test
      - name: Run mock WebSocket tests
        run: npm run test:mock
      - name: Build
        run: npm run build
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend-mock/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install mock dependencies
        run: npm ci --prefix backend-mock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests against mock API
        run: npm run test:e2e
      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
